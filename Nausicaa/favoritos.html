<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favoritos · Nausicaä: Biblioteca dos Conflitos</title>
<meta name="description" content="Temas da biblioteca e obras que você salvou neste navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-pagina="favoritos">
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo" id="topo"></header>
<main id="conteudo">
  <section class="wrap pagina">
    <h1>Favoritos</h1>
    <p class="lead">Os itens que você salvou ficam guardados neste navegador, neste aparelho. Se você limpar os dados do navegador, a lista é apagada.</p>
    <div class="cab-secao" style="margin-bottom:8px">
      <span class="contagem" id="fav-conta" aria-live="polite"></span>
      <div class="acoes" id="fav-acoes" hidden>
        <button type="button" class="btn claro" id="fav-baixar">Baixar lista (.txt)</button>
        <button type="button" class="btn claro" id="fav-limpar">Limpar favoritos</button>
      </div>
    </div>
    <div id="fav-box"></div>
  </section>
</main>
<footer class="rodape" id="rodape"></footer>
<script src="dados.js"></script>
<script src="script.js"></script>
</body>
</html>
